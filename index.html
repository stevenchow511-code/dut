<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Untuk Kamu ❤️</title>

  <style>
  body {
  margin: 0;
  font-family: 'Arial', sans-serif;
  background: url('https://i.ibb.co/jk6XTFRT/89aefb2483cd8f3f96ce2df76b9162a0.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  color: yellow;
}
    }

    .card {
      background: rgba(0,0,0,0.3);
      padding: 30px;
      border-radius: 20px;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    p {
      font-size: 16px;
      line-height: 1.5;
    }

    .heart {
      font-size: 40px;
      animation: beat 1s infinite;
    }

    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: white;
      color: #ff4d6d;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="heart">❤️</div>
    <h1>Hai Dut ❤️</h1>
    <p>
      Aku nggak tau gimana cara jelasin ini,<br>
      tapi kamu itu alasan kenapa hari-hariku lebih berwarna.<br><br>
      Aku cuma mau kamu tau,<br>
      aku sayang kamu... hari ini, besok, dan seterusnya 💕
	  semangat buat hari ini ya dut 💕
    </p>

    <button onclick="alert('Love youu Dut ❤️')">
      Klik kalau kamu juga sayang aku
    </button>
  </div>

</body>
</html>
